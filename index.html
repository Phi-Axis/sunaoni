<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#F5E9CE">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5E9CE;
    --panel: #FFFBF2;
    --panel-2: #F1DFB5;
    --groove: #ECD9A9;
    --amber: #C8352B;
    --amber-dim: #8F2A1D;
    --green: #3B6B4A;
    --green-dim: #D8E8DC;
    --text: #3B2A1D;
    --text-muted: #9C8265;
    --red: #9C3B2A;
    --ko-font: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(circle at 50% -10%, #FFFFFF 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Noto Sans JP', sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:16px 10px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  .deck{
    width:100%;
    max-width:480px;
    background:var(--panel);
    border-radius:18px;
    border:1px solid #F5D9B8;
    box-shadow:0 24px 50px -18px rgba(150,100,50,0.28), inset 0 1px 0 rgba(255,255,255,0.6);
  }
  @media (max-width:420px){
    body{ padding:10px 6px calc(20px + env(safe-area-inset-bottom)); }
    .deck{ border-radius:14px; }
    .brand{ padding:14px 16px 0; }
    .reel-bay{ padding:16px 44px 6px; }
    .reel{ width:60px; height:60px; }
    .tape-path{ left:74px; right:74px; }
    .window{ margin:6px 16px 14px; padding:12px 14px; }
    .section{ padding:12px 16px; }
    .transport{ gap:18px; padding:16px 16px 4px; }
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:16px 20px 0;
  }
  .brand .name{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    letter-spacing:0.08em;
    font-size:18px;
    color:var(--text-muted);
    text-transform:uppercase;
  }
  .brand .model{
    font-family:'Space Mono', monospace;
    font-size:14px;
    color:var(--amber-dim);
  }

  /* Reels */
  .reel-bay{
    position:relative;
    padding:22px 56px 8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .tape-path{
    position:absolute;
    left:92px; right:92px; top:52%;
    height:2px;
    background:linear-gradient(90deg, transparent, #F0C68F 15%, #F0C68F 85%, transparent);
    z-index:0;
  }
  .reel{
    width:76px; height:76px;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, var(--groove) 0 18%, #FFD9AE 19% 32%, var(--groove) 33% 100%);
    position:relative;
    z-index:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow: inset 0 0 0 1px #F0C494, 0 6px 14px rgba(150,100,50,0.18);
    animation: spin 3s linear infinite;
    animation-play-state: paused;
  }
  .reel.spinning{ animation-play-state: running; }
  .reel::before{
    content:'';
    position:absolute;
    width:100%; height:100%;
    border-radius:50%;
    background:
      conic-gradient(from 0deg,
        transparent 0 10deg, #E8A65E 10deg 14deg,
        transparent 14deg 100deg, #E8A65E 100deg 104deg,
        transparent 104deg 190deg, #E8A65E 190deg 194deg,
        transparent 194deg 280deg, #E8A65E 280deg 284deg,
        transparent 284deg 360deg);
  }
  .reel .hub{
    width:14px; height:14px; border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px rgba(200,53,43,0.5);
    z-index:2;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Window / track name + counter */
  .window{
    margin:6px 20px 18px;
    background:var(--groove);
    border-radius:10px;
    padding:14px 16px;
    border:1px solid #F2DEC0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .track-name{
    font-size:19px;
    font-weight:600;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  .track-name.empty{ color:var(--text-muted); }
  .counter{
    font-family:'Space Mono', monospace;
    font-size:28px;
    font-weight:700;
    letter-spacing:0.05em;
    color:var(--amber);
    text-shadow:0 0 10px rgba(200,53,43,0.35);
    flex-shrink:0;
  }
  .counter-label{
    font-family:'Fredoka', sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.12em;
    color:var(--text-muted);
    text-transform:uppercase;
    display:block;
    text-align:right;
  }

  /* Sections */
  .section{
    padding:14px 20px;
    border-top:1px solid #F2DEC0;
  }
  .section-label{
    font-family:'Fredoka', sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.1em;
    color:var(--text-muted);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .section-label-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .section-label-row .section-label{ margin-bottom:0; }
  .tools{ display:flex; gap:8px; }
  .eye-btn{
    width:34px; height:34px;
    border-radius:8px;
    border:1px solid #F0C68F;
    background:var(--panel-2);
    color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    padding:0;
  }
  .eye-btn svg{ width:17px; height:17px; }
  .eye-btn:active{ transform:scale(0.92); }
  .eye-btn.active{
    color:var(--green);
    border-color:var(--green);
    background:rgba(59,107,74,0.1);
  }
  .eye-btn:disabled{ opacity:.4; cursor:default; }

  /* Script: editor */
  #scriptArea{
    width:100%;
    min-height:320px;
    resize:none;
    overflow:hidden;
    -webkit-appearance:none;
    appearance:none;
    background:var(--groove);
    border:1px solid #F2DEC0;
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:var(--ko-font);
    font-size:16px;
    line-height:1.8;
    outline:none;
  }
  #scriptArea:focus{ border-color:var(--amber-dim); }
  #scriptArea::placeholder{ color:var(--text-muted); font-family:'Noto Sans JP', sans-serif; }

  /* Script: sand view */
  .script-view{
    background:var(--groove);
    border:1px solid #F2DEC0;
    border-radius:10px;
    padding:14px 14px 40px;
    min-height:160px;
  }
  #script{ position:relative; }
  #lines{
    font-family:var(--ko-font);
    font-weight:500;
    font-size:clamp(19px,5.4vw,24px);
    line-height:2;
    color:var(--text);
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  .ln{ white-space:pre-wrap; overflow-wrap:break-word; }
  .ln.blank{ height:1em; }
  .w{ display:inline-block; white-space:nowrap; max-width:100%; }
  .ch{
    display:inline-block;
    transition:opacity .55s ease, transform .75s ease-in;
  }
  .ch.gone{ opacity:0; transform:translateY(12px) scale(.8) rotate(6deg); }
  #sand{ position:absolute; left:0; top:0; width:0; height:0; pointer-events:none; }
  #sand i{
    position:absolute; border-radius:50%; background:var(--text);
    will-change:transform, opacity;
  }

  /* 「言った！」ボタン（スクロールしても画面下に残る） */
  .say-wrap{
    position:sticky;
    bottom:calc(10px + env(safe-area-inset-bottom));
    padding-top:22px;
    margin-top:-8px;
    background:linear-gradient(to bottom, rgba(255,251,242,0), var(--panel) 45%);
    z-index:5;
  }
  .say-note{
    text-align:center;
    font-size:15px;
    font-weight:500;
    color:var(--text-muted);
    padding-bottom:8px;
  }
  .say-note:empty{ display:none; }
  .btn-say{
    width:100%;
    min-height:60px;
    border:none;
    border-radius:16px;
    background:var(--amber);
    color:#FFFFFF;
    font-family:'Noto Sans JP', sans-serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.08em;
    box-shadow:0 6px 18px rgba(200,53,43,0.3);
    cursor:pointer;
    transition:transform 0.1s, filter 0.15s;
    -webkit-user-select:none; user-select:none;
  }
  .btn-say:active{ transform:scale(0.98); filter:brightness(1.08); }

  /* Audio: dropzone / list */
  .dropzone{
    border:1.5px dashed #F0C68F;
    border-radius:10px;
    padding:20px 16px;
    min-height:48px;
    text-align:center;
    cursor:pointer;
    transition:border-color 0.15s, background 0.15s;
    font-size:16px;
    line-height:1.5;
    color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--amber);
    background:rgba(200,53,43,0.08);
    color:var(--text);
  }
  .dropzone:active{ background:rgba(200,53,43,0.1); }
  .dropzone input{ display:none; }

  .big-dropzone{
    flex-direction:column;
    gap:10px;
    padding:34px 16px;
    min-height:120px;
    border-width:2px;
    border-radius:14px;
  }
  .dropzone-icon{
    width:38px; height:38px;
    color:var(--amber);
    flex-shrink:0;
  }
  .dropzone-label{
    font-family:'Fredoka', sans-serif;
    font-size:18px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--text);
    text-align:center;
    line-height:1.4;
    max-width:270px;
  }

  .playlist{
    list-style:none; margin:10px 0 0; padding:0;
  }
  .playlist li{
    display:flex; align-items:center; gap:10px;
    padding:12px 10px;
    min-height:44px;
    border-radius:8px;
    font-size:16px;
    background:var(--panel-2);
    color:var(--text);
  }
  .playlist .idx{
    font-family:'Space Mono', monospace;
    font-size:13px;
    width:22px;
    color:var(--green);
  }
  .playlist .lname{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .playlist .del{
    background:none; border:none; color:var(--text-muted);
    cursor:pointer; font-size:19px; padding:6px 10px;
    min-width:36px; min-height:36px;
    border-radius:6px;
  }
  .playlist .del:hover{ color:var(--red); background:rgba(156,59,42,0.1); }
  .empty-msg{ font-size:14px; color:var(--text-muted); padding:6px 2px; }

  /* Transport */
  .transport{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:18px 20px 6px;
  }
  .btn-round{
    width:52px; height:52px;
    border-radius:50%;
    border:1px solid #F0C68F;
    background:var(--panel-2);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform 0.1s, border-color 0.15s;
    flex-shrink:0;
    padding:0;
  }
  .btn-round:hover{ border-color:var(--amber); }
  .btn-round:active{ transform:scale(0.92); }
  .btn-round.on{
    border-color:var(--amber);
    color:var(--amber);
    background:rgba(200,53,43,0.1);
  }
  .btn-play{
    width:72px; height:72px;
    background:var(--amber);
    color:#FFFFFF;
    border:none;
    box-shadow:0 6px 18px rgba(200,53,43,0.3);
  }
  .btn-play:hover{ border-color:transparent; filter:brightness(1.08); }
  .btn-play svg, .btn-round svg{ width:20px; height:20px; }
  .btn-play svg{ width:26px; height:26px; }

  .status-bar{
    display:flex; align-items:center; gap:6px;
    justify-content:center;
    padding:14px 20px 18px;
    font-family:'Space Mono', monospace;
    font-size:13px;
    color:var(--text-muted);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--text-muted);
  }
  .dot.live{ background:var(--green); box-shadow:0 0 6px var(--green); }
  .dot.pausegap{ background:var(--amber); box-shadow:0 0 6px var(--amber); }

  .hidden{ display:none !important; }

  @media (prefers-reduced-motion: reduce){
    .reel{ animation:none; }
    .ch{ transition:opacity .2s linear; }
    .ch.gone{ transform:none; }
  }
</style>
</head>
<body>

<div class="deck">
  <div class="brand">
    <span class="name">砂鬼</span>
    <span class="model">MODEL SD-0</span>
  </div>

  <div class="reel-bay">
    <div class="tape-path"></div>
    <div class="reel" id="reelL"><div class="hub"></div></div>
    <div class="reel" id="reelR"><div class="hub"></div></div>
  </div>

  <div class="window">
    <div class="track-name empty" id="trackName">ファイル未選択</div>
    <div>
      <span class="counter-label">SAND</span>
      <span class="counter" id="sandCount">----</span>
    </div>
  </div>

  <!-- 台本 -->
  <div class="section script-section">
    <div class="section-label-row">
      <div class="section-label">台本</div>
      <div class="tools">
        <button class="eye-btn" id="resetBtn" title="全文に戻す" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="eye-btn" id="editBtn" title="台本を編集">
          <svg id="editIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </button>
      </div>
    </div>

    <textarea id="scriptArea" placeholder="ここに台本を貼り付けてください" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" lang="ko"></textarea>

    <div class="script-view hidden" id="scriptView">
      <div id="script">
        <div id="lines" lang="ko"></div>
        <div id="sand"></div>
      </div>
    </div>

    <div class="say-wrap hidden" id="sayWrap">
      <div class="say-note" id="sayNote"></div>
      <button class="btn-say" id="sayBtn" type="button">言った！</button>
    </div>
  </div>

  <!-- 音声ファイル -->
  <div class="section">
    <div class="section-label">音声ファイル</div>
    <label class="dropzone big-dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dropzone-icon"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span class="dropzone-label">音読さんの音声をドラッグ&ドロップ、またはタップして選ぶ</span>
      <input type="file" id="fileInput" accept=".mp3,.m4a,.wav,.aac,.aiff,.ogg,audio/*">
    </label>
    <ul class="playlist" id="playlist"></ul>
    <div class="empty-msg" id="emptyMsg">まだファイルがありません</div>
  </div>

  <div class="transport">
    <button class="btn-round" id="restartBtn" title="最初から再生">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12L9 12z"/></svg>
    </button>
    <button class="btn-round btn-play" id="playBtn" title="再生/一時停止">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="btn-round on" id="loopBtn" title="ループ再生">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>
    </button>
  </div>

  <div class="status-bar">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">停止中</span>
  </div>
</div>

<audio id="audio" playsinline></audio>

<script>
(() => {
  /* =====================================================
     調整用の設定（消える速度・演出・ループ間隔はここだけ）
     ===================================================== */
  const CONFIG = {
    STEPS: 10,               // 何回押すと完全に消えるか
    CURVE: 1.25,             // 1で一定ペース。大きいほど最初はゆっくり・後半に一気に消える
    PARTICLES_PER_CHAR: 4,   // 1文字あたりの砂粒の数
    MAX_PARTICLE_CHARS: 24,  // 1回の操作で砂粒を出す文字数の上限（軽さ優先）
    MAX_DELAY_MS: 220,       // 文字ごとの消え始めのばらつき
    AUDIO_GAP_SEC: 0.5       // 音声ループの間隔（鬼リピの初期値と同じ）
  };

  const $ = id => document.getElementById(id);
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 台本：入力 ⇄ 練習 ---------- */
  const scriptArea = $('scriptArea'), scriptView = $('scriptView');
  const linesEl = $('lines'), sandEl = $('sand'), scriptEl = $('script');
  const sayWrap = $('sayWrap'), sayBtn = $('sayBtn'), sayNote = $('sayNote');
  const editBtn = $('editBtn'), editIcon = $('editIcon'), resetBtn = $('resetBtn');
  const sandCount = $('sandCount');

  const ICON_CHECK = '<path d="M20 6L9 17l-5-5"/>';
  const ICON_PENCIL = '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>';

  let mode = 'edit';
  let scriptText = '';
  let chars = [];   // 消える対象の文字要素
  let order = [];   // 消える順番（ランダム）
  let step = 0;
  let gone = 0;

  function autoGrow(){
    scriptArea.style.height = 'auto';
    scriptArea.style.height = scriptArea.scrollHeight + 'px';
  }
  scriptArea.addEventListener('input', autoGrow);
  window.addEventListener('resize', autoGrow);
  autoGrow();

  function pad4(n){ return String(n).padStart(4, '0'); }

  function updateSand(){
    if (mode !== 'practice' || chars.length === 0) { sandCount.textContent = '----'; return; }
    const pct = gone >= chars.length ? 0 : Math.max(1, Math.ceil(100 * (chars.length - gone) / chars.length));
    sandCount.textContent = pad4(pct);
  }

  const eligible = /[\p{L}\p{N}]/u;   // 文字・数字だけが消える（空白・句読点・改行は残す）

  function shuffle(a){
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildScript(text){
    linesEl.textContent = '';
    sandEl.textContent = '';
    chars = [];
    text.split('\n').forEach(line => {
      const ln = document.createElement('div');
      ln.className = 'ln';
      if (line.trim() === '') {
        ln.classList.add('blank');
      } else {
        line.split(/(\s+)/).forEach(part => {
          if (part === '') return;
          if (/^\s+$/.test(part)) { ln.appendChild(document.createTextNode(part)); return; }
          const w = document.createElement('span');
          w.className = 'w';
          Array.from(part).forEach(c => {          // 1音節ブロック単位（字母には分解しない）
            if (eligible.test(c)) {
              const s = document.createElement('span');
              s.className = 'ch';
              s.textContent = c;
              w.appendChild(s);
              chars.push(s);
            } else {
              w.appendChild(document.createTextNode(c));
            }
          });
          ln.appendChild(w);
        });
      }
      linesEl.appendChild(ln);
    });
    order = shuffle(chars.map((_, i) => i));
    step = 0; gone = 0;
    sayNote.textContent = '';
    sayBtn.textContent = '言った！';
    sayBtn.dataset.done = '';
    updateSand();
  }

  function enterPractice(){
    const text = scriptArea.value.normalize('NFC').replace(/\r\n?/g, '\n').replace(/\s+$/, '');
    if (text.trim() === '') return;
    scriptText = text;
    mode = 'practice';
    buildScript(scriptText);
    scriptArea.classList.add('hidden');
    scriptView.classList.remove('hidden');
    sayWrap.classList.remove('hidden');
    editIcon.innerHTML = ICON_PENCIL;
    editBtn.classList.remove('active');
    editBtn.title = '台本を編集';
    resetBtn.disabled = false;
    updateSand();
  }

  function enterEdit(){
    mode = 'edit';
    scriptArea.value = scriptText;
    scriptArea.classList.remove('hidden');
    scriptView.classList.add('hidden');
    sayWrap.classList.add('hidden');
    editIcon.innerHTML = ICON_CHECK;
    editBtn.classList.add('active');
    editBtn.title = '台本を確定';
    resetBtn.disabled = true;
    autoGrow();
    updateSand();
  }

  function resetScript(){          // 台本は残したまま、全文表示に戻す
    buildScript(scriptText);
  }

  editBtn.addEventListener('click', () => { mode === 'edit' ? enterPractice() : enterEdit(); });
  resetBtn.addEventListener('click', resetScript);
  editBtn.classList.add('active');   // 起動時は入力モード

  /* ---------- 消える量の計算 ---------- */
  function targetCount(s){
    const n = chars.length;
    if (s >= CONFIG.STEPS) return n;
    let c = Math.round(n * Math.pow(s / CONFIG.STEPS, CONFIG.CURVE));
    c = Math.max(c, 1);                    // 押したら必ず1文字は消える
    c = Math.min(c, Math.max(n - 1, 0));   // 最終回まで完全には消さない
    return Math.max(c, gone);
  }

  function press(){
    if (chars.length === 0 || gone >= chars.length) return;
    step++;
    const target = targetCount(step);
    const newly = order.slice(gone, target);
    gone = target;
    crumble(newly);
    updateSand();
    if (gone >= chars.length) {
      sayNote.textContent = '全部消えた。台本なしで言ってみよう';
      sayBtn.textContent = 'もう一度はじめる';
      sayBtn.dataset.done = '1';
    }
  }

  sayBtn.addEventListener('click', () => {
    if (sayBtn.dataset.done === '1') resetScript(); else press();
  });

  /* ---------- 砂が崩れる演出 ---------- */
  function crumble(indices){
    const base = scriptEl.getBoundingClientRect();
    const withSand = new Set(
      indices.length > CONFIG.MAX_PARTICLE_CHARS
        ? shuffle(indices.slice()).slice(0, CONFIG.MAX_PARTICLE_CHARS)
        : indices
    );
    const frag = document.createDocumentFragment();

    indices.forEach(i => {
      const el = chars[i];
      const delay = reduceMotion ? 0 : Math.random() * CONFIG.MAX_DELAY_MS;
      el.style.transitionDelay = delay + 'ms';
      el.classList.add('gone');

      if (reduceMotion || !withSand.has(i) || !el.animate) return;
      const r = el.getBoundingClientRect();
      for (let k = 0; k < CONFIG.PARTICLES_PER_CHAR; k++) {
        const p = document.createElement('i');
        const size = 2 + Math.random() * 2.6;
        p.style.width = p.style.height = size + 'px';
        p.style.left = (r.left - base.left + Math.random() * r.width) + 'px';
        p.style.top  = (r.top - base.top + r.height * (0.3 + Math.random() * 0.5)) + 'px';
        p.style.opacity = '0';
        frag.appendChild(p);

        const dx = (Math.random() - 0.5) * 34;
        const dy = 50 + Math.random() * 80;
        const anim = p.animate([
          { transform: 'translate(0,0)', opacity: 0.85 },
          { transform: 'translate(' + (dx * 0.4) + 'px,' + (dy * 0.25) + 'px)', opacity: 0.7, offset: 0.3 },
          { transform: 'translate(' + dx + 'px,' + dy + 'px)', opacity: 0 }
        ], {
          duration: 700 + Math.random() * 600,
          delay: delay + Math.random() * 120,
          easing: 'cubic-bezier(.45,0,.9,.6)',
          fill: 'both'
        });
        anim.onfinish = () => p.remove();
      }
    });
    sandEl.appendChild(frag);
  }

  /* =====================================================
     音声（端末内のみ・外部送信なし）
     ===================================================== */
  const audio = $('audio');
  const fileInput = $('fileInput'), dropzone = $('dropzone');
  const playlistEl = $('playlist'), emptyMsg = $('emptyMsg');
  const trackName = $('trackName');
  const playBtn = $('playBtn'), playIcon = $('playIcon');
  const restartBtn = $('restartBtn'), loopBtn = $('loopBtn');
  const reelL = $('reelL'), reelR = $('reelR');
  const statusDot = $('statusDot'), statusText = $('statusText');

  let track = null;   // {name, url}
  let isPlaying = false;
  let loopOn = true;
  let gapTimer = null;

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  const AUDIO_EXT_RE = /\.(mp3|m4a|wav|aac|aiff|aif|ogg|oga|flac|wma|opus)$/i;

  function renderTrack(){
    playlistEl.innerHTML = '';
    emptyMsg.style.display = track ? 'none' : 'block';
    if (!track) return;
    const li = document.createElement('li');
    const idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = '01';
    const nm = document.createElement('span'); nm.className = 'lname'; nm.textContent = track.name;
    const del = document.createElement('button'); del.className = 'del'; del.title = '削除'; del.textContent = '✕';
    del.addEventListener('click', removeTrack);
    li.appendChild(idx); li.appendChild(nm); li.appendChild(del);
    playlistEl.appendChild(li);
  }

  function addFile(fileList){
    const f = Array.from(fileList).find(f => (f.type && f.type.startsWith('audio/')) || AUDIO_EXT_RE.test(f.name));
    if (!f) return;
    clearGapTimer();
    audio.pause();
    if (track) URL.revokeObjectURL(track.url);
    track = { name: f.name, url: URL.createObjectURL(f) };
    audio.src = track.url;
    isPlaying = false;
    updatePlayIcon();
    setStatus('idle');
    trackName.textContent = track.name;
    trackName.classList.remove('empty');
    renderTrack();
  }

  function removeTrack(){
    clearGapTimer();
    audio.pause();
    if (track) URL.revokeObjectURL(track.url);
    track = null;
    audio.removeAttribute('src');
    audio.load();
    isPlaying = false;
    updatePlayIcon();
    setStatus('idle');
    trackName.textContent = 'ファイル未選択';
    trackName.classList.add('empty');
    renderTrack();
  }

  function updatePlayIcon(){
    playIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
    reelL.classList.toggle('spinning', isPlaying);
    reelR.classList.toggle('spinning', isPlaying);
  }

  function setStatus(state){
    if (state === 'playing'){
      statusDot.className = 'dot live';
      statusText.textContent = '再生中';
    } else if (state === 'gap'){
      statusDot.className = 'dot pausegap';
      statusText.textContent = '次のリピートまで待機中…';
    } else {
      statusDot.className = 'dot';
      statusText.textContent = '停止中';
    }
  }

  function clearGapTimer(){ if (gapTimer){ clearTimeout(gapTimer); gapTimer = null; } }

  function play(){
    audio.play().then(() => {
      isPlaying = true; updatePlayIcon(); setStatus('playing');
    }).catch(() => {});
  }

  playBtn.addEventListener('click', () => {
    if (!track) return;
    if (isPlaying){
      clearGapTimer();
      audio.pause();
      isPlaying = false;
      updatePlayIcon();
      setStatus('idle');
    } else {
      play();
    }
  });

  restartBtn.addEventListener('click', () => {
    if (!track) return;
    clearGapTimer();
    audio.currentTime = 0;
    play();
  });

  loopBtn.addEventListener('click', () => {
    loopOn = !loopOn;
    loopBtn.classList.toggle('on', loopOn);
  });

  audio.addEventListener('ended', () => {
    if (!isPlaying) return;
    if (!loopOn){
      isPlaying = false;
      updatePlayIcon();
      setStatus('idle');
      return;
    }
    const proceed = () => { audio.currentTime = 0; play(); };
    if (CONFIG.AUDIO_GAP_SEC > 0){
      setStatus('gap');
      reelL.classList.remove('spinning');
      reelR.classList.remove('spinning');
      gapTimer = setTimeout(() => {
        gapTimer = null;
        if (isPlaying) proceed();
      }, CONFIG.AUDIO_GAP_SEC * 1000);
    } else {
      proceed();
    }
  });

  fileInput.addEventListener('change', e => addFile(e.target.files));
  ['dragover','dragenter'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave','drop'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', e => { if (e.dataTransfer.files.length) addFile(e.dataTransfer.files); });

  renderTrack();
})();
</script>
</body>
</html>
